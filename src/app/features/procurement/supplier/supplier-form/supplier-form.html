<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="grid grid-cols-3 gap-4">
        <app-form-field for="supplierType" label="Supplier Type" [required]="true" [error]="getError(f.supplierType)">
            <p-select inputId="supplierType" formControlName="supplierType" [options]="types" optionLabel="name"
                optionValue="value" [filter]="true" filterBy="name" [showClear]="true" placeholder="Select"
                class="w-full" />
        </app-form-field>

        <app-form-field for="supplierCode" label="Supplier Code" [required]="true" [error]="getError(f.supplierCode)">
            <input id="supplierCode" pInputText class="w-full" formControlName="supplierCode" autocomplete="off" />
        </app-form-field>

        <app-form-field for="companyName" label="Company Name" [error]="getError(f.companyName)">
            <input id="companyName" pInputText class="w-full" formControlName="companyName" autocomplete="off" />
        </app-form-field>
    </div>

    <div class="grid grid-cols-3 gap-4 mt-4">
        <app-form-field for="firstName" label="First Name" [error]="getError(f.firstName)">
            <input id="firstName" pInputText class="w-full" formControlName="firstName" autocomplete="off" />
        </app-form-field>

        <app-form-field for="lastName" label="Last Name" [error]="getError(f.lastName)">
            <input id="lastName" pInputText class="w-full" formControlName="lastName" autocomplete="off" />
        </app-form-field>

        <app-form-field for="taxRegistrationNo" label="Tax Registration No" [error]="getError(f.taxRegistrationNo)">
            <input id="taxRegistrationNo" pInputText class="w-full" formControlName="taxRegistrationNo"
                autocomplete="off" />
        </app-form-field>
    </div>

    <div class="grid grid-cols-3 gap-4 mt-4">
        <app-form-field for="registrationNo" label="Registration No" [required]="true"
            [error]="getError(f.registrationNo)">
            <input id="registrationNo" pInputText class="w-full" formControlName="registrationNo" autocomplete="off" />
        </app-form-field>

        <app-form-field for="creditLimit" label="Credit Limit" [required]="true" [error]="getError(f.creditLimit)">
            <input id="creditLimit" pInputText class="w-full" formControlName="creditLimit" type="number"
                autocomplete="off" />
        </app-form-field>

        <app-form-field for="creditPeriodDays" label="Credit Period Days" [error]="getError(f.creditPeriodDays)">
            <input id="creditPeriodDays" pInputText class="w-full" formControlName="creditPeriodDays" type="number"
                autocomplete="off" />
        </app-form-field>
    </div>

    <div class="grid grid-cols-4 gap-4 mt-4">
        <app-form-field for="paymentTerms" label="Payment Terms" [required]="true" [error]="getError(f.paymentTerms)">
            <p-select inputId="paymentTerms" formControlName="paymentTerms" [options]="paymentTerms()"
                optionLabel="name" optionValue="id" [filter]="true" filterBy="name" [showClear]="true"
                placeholder="Select" class="w-full" />
        </app-form-field>

        <app-form-field for="email" label="Email" [error]="getError(f.email)">
            <input id="email" pInputText class="w-full" formControlName="email" autocomplete="off" />
        </app-form-field>

        <app-form-field for="phone" label="Phone" [error]="getError(f.phone)">
            <input id="phone" pInputText class="w-full" formControlName="phone" autocomplete="off" />
        </app-form-field>

        <app-form-field for="website" label="Website" [error]="getError(f.website)">
            <input id="website" pInputText class="w-full" formControlName="website" autocomplete="off" />
        </app-form-field>
    </div>

    <!-- Supplier Contacts -->
    <h6 class="mb-2 mt-6">Contacts</h6>
    <div class="rounded-lg border border-surface-200">
        @for (contact of contactsArray.controls; track $index; let i = $index) {
        <div [formGroup]="contact" class="grid grid-cols-6 gap-2 items-end px-3 py-3 border-b border-surface-100">
            <app-form-field [for]="'contactName-' + i" label="Name" [required]="true"
                [error]="getError(contact.controls.name)">
                <input pInputText class="w-full" formControlName="name" />
            </app-form-field>

            <app-form-field [for]="'contactDesignation-' + i" label="Designation">
                <input pInputText class="w-full" formControlName="designation" />
            </app-form-field>

            <app-form-field [for]="'contactEmail-' + i" label="Email" [error]="getError(contact.controls.email)">
                <input pInputText class="w-full" formControlName="email" />
            </app-form-field>

            <app-form-field [for]="'contactPhone-' + i" label="Phone">
                <input pInputText class="w-full" formControlName="phone" />
            </app-form-field>

            <div class="flex flex-col items-center">
                <label class="text-sm mb-1">Primary</label>
                <p-toggleswitch formControlName="isPrimary" (onChange)="setPrimaryContact(i)" />
            </div>
            @if(mode() !== 'view'){
            <button type="button" class="text-red-500" (click)="removeContact(i)">✕ Remove</button>
            }

        </div>
        } @empty {
        <div class="p-4 text-center text-surface-500">No contacts added yet.</div>
        }
    </div>

    @if(mode() !== 'view'){
    <p-button label="Add Contact" icon="pi pi-plus" type="button" (onClick)="addContact()" styleClass="mt-2" />
    }

    <div class="flex justify-end gap-2 mt-6">
        <p-button severity="secondary" [label]="mode() === 'view' ? 'Close' : 'Cancel'" type="button"
            (onClick)="onCancel()" />
        @if(mode() !=='view'){<p-button raised severity="info" label="Save Product" type="submit"
            [loading]="submitting()" [disabled]="form.invalid || submitting()" />}
    </div>
</form>
