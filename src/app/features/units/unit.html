<div class="flex justify-between mb-2">
    <p-button (click)="open()">Add</p-button>
    <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input type="text" (input)="onSearch($any($event.target).value)" pInputText
        placeholder="Search" [value]="search()">
    </p-iconfield>
</div>

<div class="flex justify-end gap-1.5 mb-2">
    <button class="bg-emerald-900 text-white p-1 pi pi-filter-slash" pTooltip="Clear"
        tooltipStyleClass="table-action-tooltip" tooltipPosition="bottom" (click)="clearFilters()"></button>
    <button class="bg-emerald-900 text-white p-1 pi pi-refresh" pTooltip="Refresh"
        tooltipStyleClass="table-action-tooltip" tooltipPosition="bottom" (click)="fetchRecords()"></button>
</div>

<p-dialog [header]="dialogHeader()" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <app-unit-form
        (cancel)="visible = false"
        [record]="selectedRecord()"
        [mode]="formMode()"
        (save)="save($event)"
    />
</p-dialog>

<app-data-table
    [columns]="columns"
    [data]="records()"
    [actions]="actions"
    [loading]="loading()"
    [totalCount]="totalCount()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [sortColumn]="sortColumn()"
    [sortDirection]="sortDirection()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
></app-data-table>
