<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <label class="block mb-2 font-medium">Attribute</label>
  <span>{{attributeName}}</span>
  <input type="text" [value]="attributeId" formControlName="attribute" [hidden]="true">

  <div class="mt-4">
    <label class="block mb-2 font-medium">Options</label>

    <div class="rounded-lg border border-surface-200">
      @for (control of optionsArray.controls; track $index; let i = $index) {
        <div class="flex items-center gap-2 px-3 py-2 border-b border-surface-100">
          <input
            pInputText
            class="flex-1"
            [value]="control.value.value"
            (input)="updateOptionValue(i, $any($event.target).value)"
            placeholder="e.g. Red"
          />
          <button type="button" (click)="moveUp(i)" [disabled]="i === 0">↑</button>
          <button type="button" (click)="moveDown(i)" [disabled]="i === optionsArray.length - 1">↓</button>
          <button type="button" (click)="removeOption(i)">✕</button>
        </div>
      } @empty {
        <div class="p-4 text-center text-surface-500">No options yet. Add one below.</div>
      }
    </div>

    <p-button label="Add Option" icon="pi pi-plus" type="button" (onClick)="addOption()" styleClass="mt-2" />
  </div>

  <div class="flex justify-end gap-2 mt-6">
    <p-button severity="secondary" (click)="onClose()" label="Close" />
    <p-button raised severity="info" label="Save" type="submit" [loading]="submitting()" [disabled]="form.invalid || submitting()" />
  </div>
</form>
