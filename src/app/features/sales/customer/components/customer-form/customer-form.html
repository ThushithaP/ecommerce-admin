<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- <div class="grid grid-cols-2 gap-4"> -->
    <div>
        <div class="field">
            <app-form-field for="name" label="Name" [required]="true" [error]="getError(f.name)">
                <input id="name" pInputText class="w-full" formControlName="name" autocomplete="off" />
            </app-form-field>
        </div>
        <div class="field">
            <app-form-field for="email" label="Email" [required]="true" [error]="getError(f.email)">
                <input id="email" pInputText class="w-full" formControlName="email" autocomplete="off" />
            </app-form-field>
        </div>

    <!-- </div> -->
    <!-- <div class="grid grid-cols-2 gap-4"> -->
        <div class="field">
            <app-form-field for="phone" label="Phone" [required]="false" [error]="getError(f.phone)">
                <input id="phone" pInputText class="w-full" formControlName="phone" autocomplete="off" />
            </app-form-field>
        </div>
        
       <div class="field">
            <app-form-field for="dob" label="Date of birth" [required]="false" [error]="getError(f.dob)">
                <p-datepicker formControlName="dob" [showIcon]="true" [showButtonBar]="true" class="w-full" />
            </app-form-field>
        </div>
    </div>

     <div class="flex justify-end gap-2">
        <p-button severity="secondary" (click)="onCancel()" [label]="mode() === 'view' ? 'Close' : 'Cancel'" > 
        </p-button>
        @if (mode() !== 'view') {
        <p-button raised severity="info" label="Save" styleClass="w-full" type="submit" [loading]="submitting()"
            [disabled]="form.invalid || submitting()">
        </p-button>
        }
    </div>
</form>
