<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-field for="name" label="Name" [required]="true" [error]="getError(f.name)">
        <input id="name" pInputText class="w-full" formControlName="name" autocomplete="off" />
    </app-form-field>

    <app-form-field for="flatRate" label="Flat Rate" [required]="false" [error]="getError(f.flatRate)">
        <input id="flatRate" pInputText type="number" class="w-full" formControlName="flatRate" autocomplete="off" />
    </app-form-field>

    <app-form-field for="freeAboveAmount" label="Free Above Amount" [required]="false"
        [error]="getError(f.freeAboveAmount)">
        <input id="freeAboveAmount" pInputText type="number" class="w-full" formControlName="freeAboveAmount"
            autocomplete="off" />
    </app-form-field>

    <app-form-field for="estimatedDaysMin" label="Estimated Days Min" [required]="false"
        [error]="getError(f.estimatedDaysMin)">
        <input id="estimatedDaysMin" pInputText type="number" class="w-full" formControlName="estimatedDaysMin"
            autocomplete="off" />
    </app-form-field>

    <app-form-field for="estimatedDaysMax" label="Estimated Days Max" [required]="false"
        [error]="getError(f.estimatedDaysMax)">
        <input id="estimatedDaysMax" pInputText type="number" class="w-full" formControlName="estimatedDaysMax"
            autocomplete="off" />
    </app-form-field>

    <app-form-field for="description" label="Description" [required]="false" [error]="getError(f.description)">
        <input id="description" pInputText class="w-full" formControlName="description" autocomplete="off" />
    </app-form-field>

    <div class="flex justify-end gap-2">
        <p-button severity="secondary" (click)="onCancel()" [label]="mode() === 'view' ? 'Close' : 'Cancel'">
        </p-button>
        @if (mode() !== 'view') {
        <p-button raised severity="info" label="Save" styleClass="w-full" type="submit" [loading]="submitting()"
            [disabled]="form.invalid || submitting()">
        </p-button>
        }
    </div>
</form>
