<div class="flex justify-between mb-2">
    <p-button (click)="openCreate()">Add Roles</p-button>
    <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input type="text" (input)="onSearch($any($event.target).value)" pInputText
        placeholder="Search" [value]="search()">
    </p-iconfield>
</div>

<div class="flex justify-end gap-1.5 mb-2">
    <button class="bg-emerald-900 text-white p-1 pi pi-filter-slash" pTooltip="Clear"
        tooltipStyleClass="table-action-tooltip" tooltipPosition="bottom" (click)="clearFilters()"></button>
    <button class="bg-emerald-900 text-white p-1 pi pi-refresh" pTooltip="Refresh"
        tooltipStyleClass="table-action-tooltip" tooltipPosition="bottom" (click)="fetchRoles()"></button>
</div>

<p-drawer [visible]="visibleRight" (visibleChange)="visibleRight = $event"
    [header]="formMode() === 'create' ? 'Add Role' : formMode() === 'edit' ? 'Edit Role' : 'View Role'" position="right"
    class="role-drawer" styleClass="role-drawer h-auto!"
    [style]="{'margin-top': '4rem','height': 'calc(100vh - 4rem)'}">

    <app-role-form (cancel)="visibleRight = false" [role]="selectedRole()" [mode]="formMode()"
        (save)="saveRole($event)"></app-role-form>
</p-drawer>

<app-data-table [columns]="columns" [data]="roles()" [actions]="actions" [loading]="loading()"
    [totalCount]="totalCount()" [pageSize]="pageSize()" [pageIndex]="pageIndex()" [sortColumn]="sortColumn()"
    [sortDirection]="sortDirection()" (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" />
