<div class="flex items-center justify-between mb-2 pt-0">
    <div>
        <h2 class="text-xl font-semibold m-0">{{entityLabel}}</h2>
    </div>
    <p-breadcrumb [model]="items" [home]="home" />
</div>

<div class="flex items-center justify-between gap-2 mb-3">
    <p-button (click)="open()">Add</p-button>
    <div class="flex items-center gap-2">
        <p-iconfield>
            <p-inputicon class="pi pi-search" />
            <input type="text" (input)="onSearch($any($event.target).value)" pInputText
            placeholder="Search" [value]="search()">
        </p-iconfield>

        <button class="bg-emerald-900 text-white p-2 pi pi-filter-slash" pTooltip="Clear"
            tooltipStyleClass="table-action-tooltip" tooltipPosition="bottom" (click)="clearFilters()"></button>
        <button class="bg-emerald-900 text-white p-2 pi pi-refresh" pTooltip="Refresh"
            tooltipStyleClass="table-action-tooltip" tooltipPosition="bottom" (click)="fetchRecords()"></button>
    </div>
</div>

<p-dialog [header]="dialogHeader()" [modal]="true" [(visible)]="visible" [maximizable]="true" [style]="{ width: '25rem' }">
    <app-role-form
        (cancel)="visible = false"
        [record]="selectedRecord()"
        [mode]="formMode()"
        (save)="save($event)"
    />
</p-dialog>

<app-data-table
    [columns]="columns"
    [data]="records()"
    [actions]="actions"
    [loading]="loading()"
    [totalCount]="totalCount()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [sortColumn]="sortColumn()"
    [sortDirection]="sortDirection()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
></app-data-table>
