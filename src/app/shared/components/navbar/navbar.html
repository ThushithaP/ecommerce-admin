
<header class="app-navbar sticky top-0 z-50">
    <div class="app-navbar-content">

        <!-- Left: Sidebar toggle + Brand -->
        <div class="app-navbar-brand">

            <p-button
                icon="pi pi-bars"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                styleClass="app-navbar-toggle"
                ariaLabel="Toggle sidebar"
                (click)="onToggleSidebar()">
            </p-button>

            <div class="app-brand">
                <div class="app-brand-logo">
                    <img src="/profile.png" alt="">
                </div>

                <span class="app-brand-name">
                    VeeBazaa
                </span>
            </div>

        </div>

        <!-- Center: Search -->
        <div class="app-navbar-search-wrapper">

            <i class="pi pi-search app-navbar-search-icon"></i>

            <input
                pInputText
                placeholder="Search anything..."
                class="app-navbar-search"
                aria-label="Search application"
            />

            <kbd class="app-search-shortcut">Ctrl K</kbd>

        </div>

        <!-- Right: Actions + Profile -->
        <div class="app-navbar-actions">

            <p-button
                icon="pi pi-bell"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                styleClass="app-navbar-action"
                ariaLabel="Notifications">
            </p-button>

            <p-button
                icon="pi pi-moon"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                styleClass="app-navbar-action"
                ariaLabel="Toggle theme">
            </p-button>

            <div class="app-navbar-divider"></div>

            <!-- User Profile -->
            <p-button
                [text]="true"
                severity="secondary"
                styleClass="app-navbar-profile"
                (click)="userMenu.toggle($event)">

                <div class="app-profile-content">

                    @if (currentUser(); as user) {

                        <div class="app-profile-avatar">
                            {{ (user.name || 'S').charAt(0).toUpperCase() }}
                        </div>

                        <div class="app-profile-info">
                            <span class="app-profile-name">
                                {{ user.name || 'Super User' }}
                            </span>

                            <span class="app-profile-role">
                                {{ user.role || 'Super User' }}
                            </span>
                        </div>

                    }

                    <i class="pi pi-angle-down app-profile-chevron"></i>

                </div>

            </p-button>

            <p-menu
                #userMenu
                [popup]="true"
                [model]="userMenuItems">
            </p-menu>

        </div>

    </div>
</header>
