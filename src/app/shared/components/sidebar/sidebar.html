<aside class="app-sidebar" [class.collapsed]="sidebarCollapsed()">
    <nav class="app-sidebar-nav">
        @for (section of sections(); track section.label) {
        <section class="app-sidebar-section">
            @if (!sidebarCollapsed()) {
            <h3 class="app-sidebar-section-title">
                {{ section.label }}
            </h3>
            }
            <div class="app-sidebar-section-items">
                @for (item of section.items; track item.route) {
                <a [routerLink]="item.route" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: item.route === '/' }" class="app-sidebar-item"
                    [attr.title]="sidebarCollapsed() ? item.label : null"
                    [attr.aria-label]="sidebarCollapsed() ? item.label : null">
                    <i [class]="item.icon" aria-hidden="true"></i>

                    @if (!sidebarCollapsed()) {
                    <span>{{ item.label }}</span>
                    }
                </a>
                }
            </div>
        </section>
        }
    </nav>
</aside>
